components:
  schemas:
    Account:
      type: object
      description: Provides the details to identify an account.
      additionalProperties: false
      properties:
        identification:
          #  Unique and unambiguous identification for the account between the account owner and the account servicer.
          $ref: '#/components/schemas/AccountIdentificationChoice'
        type:
          #  Specifies the nature, or use of the account.
          $ref: '#/components/schemas/CashAccountTypeChoice'
        currency:
          #  'Identification of the currency in which the account is held.   Usage: Currency should only be used in case one and the same account number covers several currencies and the initiating party needs to identify which currency needs to be used for settlement on the account.'
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
        name:
          description: |
            Name of the account, as assigned by the account servicing institution, in agreement with the account owner in order to provide an additional means of identification of the account.  
            
            Usage: The account name is different from the account owner name. The account name is used in certain user communities to provide a means of identifying the account, in addition to the account owners identity and the account number.
          type: string
          minLength: 1
          maxLength: 70
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        alternate_identification:
          #  'An alternative identification of the account.   Usage: Should be used when more than one identification is required to clearly establish the identity. For example when Proxy Identification is specified in primary identification a secondary identification Proxy Code is required for unambiguous identification. Another example is when Virtual Account or Zero Balance Account is specified in the primary identification, the alternate identification should be the parent account.'
          $ref: '#/components/schemas/GenericIdentification'
      required:
      - identification
    AccountIdentificationChoice:
      type: object
      description: Specifies the unique identification of an account as assigned by the account servicer.
      additionalProperties: true
      oneOf:
        - type: object
          required:
            - iban
          properties:
            iban:
              #  International Bank Account Number (IBAN) - identifier used internationally by financial institutions to uniquely identify the account of a customer. Further specifications of the format and content of the IBAN can be found in the standard ISO 13616 "Banking and related financial services - International Bank Account Number (IBAN)" version 1997-10-01, or later revisions.
              $ref: '#/components/schemas/IBAN2007Identifier'
          additionalProperties: false
        - type: object
          required:
            - other
          properties:
            other:
              #  Unique and unambiguous identification for the account between the account owner and the account servicer. Identifier used nationally by financial institutions, i.e., in individual countries, generally as part of a National Account Numbering Scheme(s), to uniquely identify the account of a customer.
              $ref: '#/components/schemas/GenericIdentification'
          additionalProperties: false
    AccountInterest:
      type: object
      description: Provides general interest information that applies to the account at a particular moment in time.
      additionalProperties: false
      properties:
        type:
          #  Specifies the type of interest.
          $ref: '#/components/schemas/InterestTypeChoice'
        rate:
          type: array
          description:  Set of elements used to qualify the interest rate.
          items:
            $ref: '#/components/schemas/Rate'
        from_to_date:
          #  Range of time between a start date and an end date for the calculation of the interest.
          $ref: '#/components/schemas/DateTimePeriod'
        reason:
          description:  Specifies the reason for the interest.
          type: string
          minLength: 1
          maxLength: 35
        tax:
          #  Provides details on the tax applied to charges.
          $ref: '#/components/schemas/TaxCharges'
    ActiveOrHistoricCurrencyAndAmount:
      type: object
      description: A number of monetary units specified in an active or a historic currency where the unit of currency is explicit and compliant with ISO 4217.
      properties:
        currency:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
        amount:
          type: string
          maxLength: 18
          pattern: ^0*(([0-9]{0,13}\.[0-9]{1,5})|([0-9]{0,14}\.[0-9]{1,4})|([0-9]{0,15}\.[0-9]{1,3})|([0-9]{0,16}\.[0-9]{1,2})|([0-9]{0,17}\.[0-9]{1,1})|0*|([0-9]{0,18}))$
    ActiveOrHistoricCurrencyAndAmountRange:
      type: object
      description: Range of amount values.
      additionalProperties: false
      properties:
        amount:
          #  Specified amount or amount range.
          $ref: '#/components/schemas/ImpliedCurrencyAmountRangeChoice'
        credit_debit_indicator:
          #  Indicates whether the amount is a credited or debited amount.
          $ref: '#/components/schemas/CreditDebitCode'
        currency:
          #  Medium of exchange of value, used to qualify an amount.
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
      required:
      - amount
      - currency
    ActiveOrHistoricCurrencyCode:
      type: string
      pattern: ^[A-Z]{3,3}$
      description: |
        A code allocated to a currency by a Maintenance Agency under an international identification scheme, as described in the latest edition of the international standard ISO 4217 "Codes for the representation of currencies and funds".
    AmountAndCurrencyExchange:
      type: object
      description: Set of elements used to provide information on the original amount.
      additionalProperties: false
      properties:
        instructed_amount:
          #  Identifies the amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party and provides currency exchange information in case the instructed amount and/or currency is/are different from the entry amount and/or currency.
          $ref: '#/components/schemas/AmountAndCurrencyExchangeDetails'
        transaction_amount:
          #  Amount of the underlying transaction.
          $ref: '#/components/schemas/AmountAndCurrencyExchangeDetails'
        counter_value_amount:
          #  'Set of elements used to provide the countervalue amount and currency exchange information.  Usage: This can be either the counter amount quoted in an FX deal, or the result of the currency information applied to an instructed amount, before deduction of charges.'
          $ref: '#/components/schemas/AmountAndCurrencyExchangeDetails'
        announced_posting_amount:
          #  Amount of money, based on terms of corporate action event and balance of underlying securities, entitled to/from the account owner. In some situations, this amount may alternatively be called entitled amount.
          $ref: '#/components/schemas/AmountAndCurrencyExchangeDetails'
        proprietary_amount:
          type: array
          description:  Set of elements used to provide information on the original amount and currency exchange.
          items:
            $ref: '#/components/schemas/AmountAndCurrencyExchangeDetails'
    AmountAndCurrencyExchangeDetails:
      type: object
      description: Set of elements used to provide information on the original amount and currency exchange.
      additionalProperties: false
      properties:
        amount:
          #  Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.
          $ref: '#/components/schemas/CurrencyAmount'
        currency_exchange:
          #  Set of elements used to provide details on the currency exchange.
          $ref: '#/components/schemas/CurrencyExchange'
      required:
      - amount
    AmountRangeBoundary:
      type: object
      description: Limit for an amount range.
      additionalProperties: false
      properties:
        boundary_amount:
          #  Amount value of the range limit.
          $ref: '#/components/schemas/ImpliedCurrencyAndAmount'
        included:
          description:  Indicates whether the boundary amount is included in the range of amount values.
          type: boolean
      required:
      - boundary_amount
      - included
    AnyBICDec2014Identifier:
      type: string
      description: 'Code allocated to a financial or non-financial institution by the ISO 9362 Registration Authority, as described in ISO 9362: 2014 - "Banking - Banking telecommunication messages - Business identifier code (BIC)".'
      pattern: ^[A-Z0-9]{4,4}[A-Z]{2,2}[A-Z0-9]{2,2}([A-Z0-9]{3,3}){0,1}$
    Balance:
      type: object
      description: Numerical representation of the net increases and decreases in an account at a specific point in time.
      additionalProperties: false
      properties:
        type:
          #  Specifies the nature of a balance.
          $ref: '#/components/schemas/BalanceTypeCode'
        amount:
          #  Amount that is the result of the sum of the entries from or to an account.
          $ref: '#/components/schemas/CurrencyAmount'
        credit_debit_indicator:
          #  'Indicates whether the balance is a credit or a debit balance.  Usage: A zero balance is considered to be a credit balance.'
          $ref: '#/components/schemas/CreditDebitCode'
        date:
          description: |
            Indicates the date (and time) of the balance. Recommendation that this be expressed in local time with UTC offset format (YYYY-MM-DDThh:mm:ss.sss+/-hh:mm).
          oneOf:
            - $ref: '#/components/schemas/ISODateTime'
            - $ref: '#/components/schemas/ISODate'
        credit_line:
          type: array
          description:  Set of elements used to provide details on the credit line.
          items:
            $ref: '#/components/schemas/CreditLine'
        availability:
          type: array
          description: |
            Set of elements used to indicate when the booked amount of money will become available, that is can be accessed and starts generating interest.   
            
            Usage: This type of information is used in the US and is linked to particular instruments such as cheques. Example: When a cheque is deposited, it will be booked on the deposit day, but the amount of money will only be accessible as of the indicated availability day (according to national banking regulations).
          items:
            $ref: '#/components/schemas/BalanceAvailability'
      required:
      - type
      - amount
      - credit_debit_indicator
      - date
    BalanceAvailability:
      type: object
      description: Indicates when the amount of money will become available, that is can be accessed and start generating interest.
      additionalProperties: false
      properties:
        date:
          #  Indicates when the amount of money will become available.
          $ref: '#/components/schemas/ISODate'
        amount:
          #  Identifies the available amount.
          $ref: '#/components/schemas/CurrencyAmount'
        credit_debit_indicator:
          #  'Indicates whether the availability balance is a credit or a debit balance.  Usage: A zero balance is considered to be a credit balance.'
          $ref: '#/components/schemas/CreditDebitCode'
      required:
      - date
      - amount
      - credit_debit_indicator
    BalanceTypeCode:
      type: string
      description: |
        Specifies the nature of the balance.
        *`CLAV_closing_available`-Closing balance of amount of money that is at the disposal of the account owner on the date specified.
        *`CLBD_closing_booked`-Balance of the account at the end of the pre-agreed account reporting period. It is the sum of the opening booked balance at the beginning of the period and all entries booked to the account during the pre-agreed account reporting period.
        *`FWAV_forward_available`-Forward available balance of money that is at the disposal of the account owner on the date specified.
        *`ITAV_interim_available`-Available balance calculated in the course of the account servicer's business day, at the time specified, and subject to further changes during the business day. The interim balance is calculated on the basis of booked credit and debit items during the calculation time/period specified.
        *`OPAV_opening_available`- Opening balance of amount of money that is at the disposal of the account owner on the date specified.
        *`OPBD_opening_booked`-Book balance of the account at the beginning of the account reporting period. It always equals the closing book balance from the previous report.
        *`PRCD_previously_closed_booked`-Balance of the account at the previously closed account reporting period. The opening booked balance for the new period has to be equal to this balance. 
        
        Usage: the previously booked closing balance should equal (inclusive date) the booked closing balance of the date it references and equal the actual booked opening balance of the current date.
      enum:
      - CLAV
      - CLBD
      - FWAV
      - ITAV
      - OPAV      
      - OPBD
      - PRCD
    BankTransactionCode:
      type: object
      description: Set of elements used to identify the type or operations code of a transaction entry.
      additionalProperties: false
      properties:
        domain_code:
          description: |
            Specifies the external domain code of the bank transaction code (business area of the underlying transaction) in the format of character string with a maximum length of 4 characters. The list of valid codes is an external code list published separately. External code sets can be downloaded from www.iso20022.org.
          type: string
          minLength: 1
          maxLength: 4
        family_code:
          description: |
            Specifies the bank transaction code family within a domain, as published in an external bank transaction code family code list. External code sets can be downloaded from www.iso20022.org.
          type: string
          minLength: 1
          maxLength: 4
        sub_family_code:
          description: |
            Specifies the bank transaction code sub-product (sub-family) family within a specific family, as published in an external bank transaction code sub-family code list. External code sets can be downloaded from www.iso20022.org.
          type: string
          minLength: 1
          maxLength: 4
        proprietary_code:
          description: |
            Proprietary bank transaction code to identify the underlying transaction.
          type: string
          minLength: 1
          maxLength: 35
        issuer:
          description: |
            Identification of the issuer of the proprietary bank transaction code.
          type: string
          minLength: 1
          maxLength: 35
    BaseOneRate:
      description: Rate expressed as a decimal, for example, 0.7 is 7/10 and 70%.
      type: string
      maxLength: 12
    BatchInformation:
      type: object
      description: Provides details on batched transactions.
      additionalProperties: false
      properties:
        message_identification:
          description: Point to point reference, as assigned by the sending party, to unambiguously identify the batch of transactions.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        payment_information_identification:
          description:  Unique identification, as assigned by a sending party, to unambiguously identify the payment information group within the message.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        number_of_transactions:
          #  Number of individual transactions included in the batch.
          type: integer
          format: int32
          minLength: 1
          maxLength: 15
        total_amount:
          #  Total amount of money reported in the batch entry.
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        credit_debit_indicator:
          #  Indicates whether the batch entry is a credit or a debit entry.
          $ref: '#/components/schemas/CreditDebitCode'
    BranchAndFinancialInstitutionIdentification:
      type: object
      description: Unique and unambiguous identification of a financial institution or a branch of a financial institution.
      additionalProperties: false
      properties:
        financial_institution_identification:
          #  Unique and unambiguous identification of a financial institution, as assigned under an internationally recognised or proprietary identification scheme.
          $ref: '#/components/schemas/FinancialInstitutionIdentification'
        branch_identification:
          #  'Identifies a specific branch of a financial institution.  Usage: This component should be used in case the identification information in the financial institution component does not provide identification up to branch level.'
          $ref: '#/components/schemas/BranchIdentification'
      required:
      - financial_institution_identification
    BranchIdentification:
      type: object
      description: Information that locates and identifies a specific branch of a financial institution.
      additionalProperties: false
      properties:
        identification:
          description: Unique and unambiguous identification of a branch of a financial institution.
          type: string
          minLength: 1
          maxLength: 35
        lei:
          #  Legal entity identification for the branch of the financial institution.
          $ref: '#/components/schemas/LEIIdentifier'
        name:
          description:  Name by which an agent is known and which is usually used to identify that agent.
          type: string
          minLength: 1
          maxLength: 35
        postal_address:
          description: |
            Information that locates and identifies a specific address, as defined by postal services.

            RECOMMENDATION IN ORDER OF PREFERENCE: 
            * Use only structured address with mandatory Town Name and Country 
            * When using unstructured address, (Address Line), max 1 occurrence with 105 text is allowed. 
            * Address Line must not contain Country which must be included in the dedicated Country element in the unstructured structured address. 
          oneOf:
            - $ref: '#/components/schemas/PostalAddress'
            - $ref: '#/components/schemas/PostalAddressUnstructured'
    CashAccount:
      type: object
      description: Provides the details to identify an account.
      additionalProperties: false
      properties:
        identification:
          #  Unique and unambiguous identification for the account between the account owner and the account servicer.
          $ref: '#/components/schemas/AccountIdentificationChoice'
        type:
          #  Specifies the nature, or use of the account.  Usage - when primary account is Virtual Account (VACC) or Zero Balance account (ZABA) the account type is mandatory.
          $ref: '#/components/schemas/CashAccountTypeChoice'
        currency:
          #  'Identification of the currency in which the account is held.  Usage: Currency should only be used in case one and the same account number covers several currencies and the initiating party needs to identify which currency needs to be used for settlement on the account.'
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
        name:
          description: |
            Name of the account, as assigned by the account servicing institution, in agreement with the account owner in order to provide an additional means of identification of the account.  
            
            Usage: The account name is different from the account owner name. The account name is used in certain user communities to provide a means of identifying the account, in addition to the account owner's identity and the account number.
          type: string
          minLength: 1
          maxLength: 70
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        alternate_identification:
          #  'An alternative identification of the account.   Usage: Should be used when more than one identification is required to clearly establish the identity. For example when proxy identification is used to perform the transaction, that identification should be specified here. Another example is when Virtual Account or Zero Balance Account is specified in the primary identification, the alternate identification should be the parent account.'
          $ref: '#/components/schemas/GenericIdentification'
        owner:
          #  Party that legally owns the account.
          $ref: '#/components/schemas/PartyIdentification'
        servicer:
          #  Party that manages the account on behalf of the account owner, that is manages the registration and booking of entries on the account, calculates balances on the account and provides information about the account.
          $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification'
      required:
      - identification
      - currency
    CashAccountTypeChoice:
      type: object
      description: Nature or use of the account.
      additionalProperties: true
      oneOf:
        - type: object
          required:
            - code
          properties:
            code:
              #  Account type, in a coded form.
              $ref: '#/components/schemas/ExternalCashAccountTypeCode'
          additionalProperties: false
        - type: object
          required:
            - proprietary
          properties:
            proprietary:
              description:  Nature or use of the account in a proprietary form.
              type: string
              minLength: 1
              maxLength: 35
          additionalProperties: false
    CashAvailability:
      type: object
      description: Indicates when the amount of money will become available, that is can be accessed and start generating interest.
      additionalProperties: false
      properties:
        date:
          #  Indicates when the amount of money will become available.
          $ref: '#/components/schemas/ISODate'
        amount:
          #  Identifies the available amount.
          $ref: '#/components/schemas/CurrencyAmount'
        credit_debit_indicator:
          #  'Indicates whether the availability balance is a credit or a debit balance.  Usage: A zero balance is considered to be a credit balance.'
          $ref: '#/components/schemas/CreditDebitCode'
      required:
      - date
      - amount
      - credit_debit_indicator
    ChargeBearerTypeCode:
      type: string
      description: |
        Specifies which party(ies) will pay charges due for processing of the instruction.
        *`DEBT_borne_by_debtor`-All transaction charges are to be borne by the debtor.
        *`CRED_borne_by_creditor`-All transaction charges are to be borne by the creditor.
        *`SHAR_shared`-In a credit transfer context, means that transaction charges on the sender side are to be borne by the debtor, transaction charges on the receiver side are to be borne by the creditor. In a direct debit context, means that transaction charges on the sender side are to be borne by the creditor, transaction charges on the receiver side are to be borne by the debtor.
        *`SLEV_following_service_level`-Charges are to be applied following the rules agreed in the service level and/or scheme.
      enum:
      - DEBT
      - CRED
      - SHAR
      - SLEV
    Charges:
      type: object
      description: Provides further details on the charges related to the payment transaction.
      additionalProperties: false
      properties:
        total_charges_and_tax_amount:
          #  Total of all charges and taxes applied to the entry.
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        record:
          type: array
          description:  Provides details of the individual charges record.
          items:
            $ref: '#/components/schemas/ChargesRecord'
    ChargesRecord:
      type: object
      description: Provides further individual record details on the charges related to the payment transaction.
      additionalProperties: false
      properties:
        amount:
          #  Transaction charges to be paid by the charge bearer.
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
        credit_debit_indicator:
          #  'Indicates whether the charges amount is a credit or a debit amount.  Usage: A zero amount is considered to be a credit.'
          $ref: '#/components/schemas/CreditDebitCode'
        charge_included_indicator:
          description:  Indicates whether the charge should be included in the amount or is added as pre-advice.
          type: boolean
        type:
          #  Specifies the type of charge.
          $ref: '#/components/schemas/GenericIdentification'
        rate:
          #  Rate used to calculate the amount of the charge or fee.
          $ref: '#/components/schemas/PercentageRate'
        bearer:
          #  Specifies which party/parties will bear the charges associated with the processing of the payment transaction.
          $ref: '#/components/schemas/ChargeBearerTypeCode'
        agent:
          #  Agent that takes the transaction charges or to which the transaction charges are due.
          $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification'
        tax:
          #  Provides details on the tax applied to charges.
          $ref: '#/components/schemas/TaxCharges'
      required:
      - amount
    ClearingSystemIdentificationChoice:
      type: object
      description: Choice of a clearing system identifier.
      additionalProperties: true
      oneOf:
        - type: object
          required:
            - code
          properties:
            code:
              #  Identification of a clearing system, in a coded form as published in an external list.
              $ref: '#/components/schemas/ExternalClearingSystemIdentificationCode'
          additionalProperties: false
        - type: object              
          required:
            - proprietary
          properties:
            proprietary:
              description:  Identification code for a clearing system, that has not yet been identified in the list of clearing systems.
              type: string
              minLength: 1
              maxLength: 35
          additionalProperties: false
    ClearingSystemMemberIdentification:
      type: object
      description: Unique identification, as assigned by a clearing system, to unambiguously identify a member of the clearing system.
      additionalProperties: false
      properties:
        clearing_system_identification:
          #  Specification of a pre-agreed offering between clearing agents or the channel through which the payment instruction is processed.
          $ref: '#/components/schemas/ClearingSystemIdentificationChoice'
        member_identification:
          description:  Identification of a member of a clearing system.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
      required:
      - member_identification
    CountryCode:
      type: string
      pattern: ^[A-Z]{2,2}$
      description: |
        Code to identify a country, a dependency, or another area of particular geopolitical interest, on the basis of country names obtained from the United Nations (ISO 3166, Alpha-2 code).
    CreditDebitCode:
      type: string
      description: |
        Specifies if an operation is an increase or a decrease.
        *`CRDT_credit`-Operation is an increase.
        *`DBIT_debit`-Operation is a decrease.
      enum:
      - CRDT
      - DBIT
    CreditLine:
      type: object
      description: Specifies the details of a credit line.
      additionalProperties: false
      properties:
        included:
          description:  Indicates whether or not the credit line is included in the balance.
          type: boolean
          default: false
        type:
          #  Type of the credit line provided when multiple credit lines may be provided.
          $ref: '#/components/schemas/ExternalCreditLineTypeCode'
        amount:
          #  Amount of money of the credit line.
          $ref: '#/components/schemas/CurrencyAmount'
      required:
      - included
    CurrencyAmount:
      type: object
      description: |
        Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.
      additionalProperties: false
      required:
      - currency_code
      - amount
      properties:
        currency_code:
          description: |
            ISO three character currency code.
            
            The Currency Code must be registered, or have already been registered. Valid active or historic currency codes are registered with the ISO 4217 Maintenance Agency, consist of three (3) contiguous letters, and may be or not be withdrawn on the day the message containing the Currency is exchanged.
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3,3}$
        amount:
          description: |
            The amount with fractional digit. The number of fractional digits (or minor unit of currency) must comply with ISO 4217. 
            
            fractionDigits - 5
            totalDigits - 18
            *`Note:` The decimal separator is a dot.
          type: string
          maxLength: 19
          pattern: '^0*(([0-9]{0,13}\.[0-9]{1,5})|([0-9]{0,14}\.[0-9]{1,4})|([0-9]{0,15}\.[0-9]{1,3})|([0-9]{0,16}\.[0-9]{1,2})|([0-9]{0,17}\.[0-9]{1,1})|0*|([0-9]{0,18}))$'
    CurrencyCode:
      description: |
        Code allocated to a currency, by a maintenance agency, under an international identification scheme as described in the latest edition of the international standard ISO 4217 "Codes for the representation of currencies and funds". Valid currency codes are registered with the ISO 4217 Maintenance Agency, and consist of three contiguous letters.
      type: string
      pattern: ^[A-Z]{3,3}$
    CurrencyExchange:
      type: object
      description: Set of elements used to provide details of the currency exchange.
      additionalProperties: false
      properties:
        source_currency:
          #  Currency from which an amount is to be converted in a currency conversion.
          $ref: '#/components/schemas/CurrencyCode'
        target_currency:
          #  Currency into which an amount is to be converted in a currency conversion.
          $ref: '#/components/schemas/CurrencyCode'
        unit_currency:
          #  Currency in which the rate of exchange is expressed in a currency exchange. In the example 1GBP = xxxCUR, the unit currency is GBP.
          $ref: '#/components/schemas/CurrencyCode'
        exchange_rate:
          #  'Factor used to convert an amount from one currency into another. This reflects the price at which one currency was bought with another currency.  Usage: ExchangeRate expresses the ratio between UnitCurrency and QuotedCurrency (ExchangeRate = UnitCurrency/QuotedCurrency).'
          $ref: '#/components/schemas/BaseOneRate'
        contract_identification:
          description:  Unique identification to unambiguously identify the foreign exchange contract.
          type: string
          minLength: 1
          maxLength: 35
        quotation_date:
          #  Date and time at which an exchange rate is quoted.
          $ref: '#/components/schemas/ISODateTime'
      required:
      - source_currency
      - exchange_rate
    DateAndPlaceOfBirth:
      type: object
      description: Date and place of birth of a person.
      additionalProperties: false
      properties:
        birth_date:
          #  Date on which a person is born.
          $ref: '#/components/schemas/ISODate'
        province_of_birth:
          description:  Province where a person was born.
          type: string
          minLength: 1
          maxLength: 35
        city_of_birth:
          description:  City where a person was born.
          type: string
          minLength: 1
          maxLength: 35
        country_of_birth:
          #  Country where a person was born.
          $ref: '#/components/schemas/CountryCode'
      required:
      - birth_date
      - city_of_birth
      - country_of_birth
    DateTimePeriod:
      type: object
      description: Time span defined by a start date and time, and an end date and time.
      additionalProperties: false
      properties:
        from_date_time:
          #  Date and time at which the period starts.
          $ref: '#/components/schemas/ISODateTime'
        to_date_time:
          #  Date and time at which the period ends.
          $ref: '#/components/schemas/ISODateTime'
      required:
      - from_date_time
      - to_date_time
    Document:
      type: object
      description: General information that unambiguously identifies a document, such as identification number and issue date time.
      additionalProperties: false
      properties:
        type:
          # description:  Specifies the type of referred document.
          $ref: '#/components/schemas/ReferredDocumentTypeChoice'
        number:
          description:  Unique and unambiguous identification of the referred document.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !#$%&\*=^_`\{\|\}~";<>@\[\\\]]+$
        related_date:
          #  Date associated with the referred document. Expressed in the YYYY-MM-DD format.
          $ref: '#/components/schemas/ISODate'
        line_details:
          type: array
          description:  Set of elements used to provide the content of the referred document line.
          items:
            $ref: '#/components/schemas/DocumentItem'
    DocumentItem:
      type: object
      description: General information that unambiguously identifies a document, such as identification number and issue date time.
      additionalProperties: false
      properties:
        identification:
          description:  Provides identification of the document item line.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !#$%&\*=^_`\{\|\}~";<>@\[\\\]]+$          
        description:
          description:  Description associated with the document item line.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !#$%&\*=^_`\{\|\}~";<>@\[\\\]]+$
        amount:
          #  Provides details on the amounts of the document item line.
          $ref: '#/components/schemas/CurrencyAmount'
        credit_debit_indicator:
          #  Indicates whether the entry is a credit or a debit entry.
          $ref: '#/components/schemas/CreditDebitCode'
        adjustment_reason:
          description:  Specifies the reason for the adjustment.
          type: string
          minLength: 1
          maxLength: 35
      required:
      - identification
    DocumentTypeCode:
      type: string
      description: |
        Specifies a type of financial or commercial document.
        *`MSIN_metered_service_invoice`-Document is an invoice claiming payment for the supply of metered services, for example gas or electricity supplied to a fixed meter.
        *`CNFA_credit_note_related_to_financial_adjustment`-Document is a credit note for the final amount settled for a commercial transaction.
        *`DNFA_debit_note_related_to_financial_adjustment`-Document is a debit note for the final amount settled for a commercial transaction.
        *`CINV_commercial_invoice`-Document is an invoice.
        *`CREN_credit_note`-Document is a credit note.
        *`DEBN_debit_note`-Document is a debit note.
        *`HIRI_hire_invoice`-Document is an invoice for the hiring of human resources or renting goods or equipment.
        *`SBIN_self_billed_invoice`-Document is an invoice issued by the debtor.
        *`CMCN_commercial_contract`-Document is an agreement between the parties, stipulating the terms and conditions of the delivery of goods or services.
        *`SOAC_statement_of_account`-Document is a statement of the transactions posted to the debtor's account at the supplier.
        *`DISP_dispatch_advice`-Document is a dispatch advice.
        *`BOLD_bill_of_lading`-Document is a shipping notice.
        *`VCHR_voucher`-Document is an electronic payment document.
        *`AROI_account_receivable_open_item`-Document is a payment that applies to a specific source document.
        *`TSUT_trade_services_utility_transaction`-Document is a transaction identifier as assigned by the Trade Services Utility.
        *`PUOR_purchase_order`-Document is a purchase order.
      enum:
      - MSIN
      - CNFA
      - DNFA
      - CINV
      - CREN
      - DEBN
      - HIRI
      - SBIN
      - CMCN
      - SOAC
      - DISP
      - BOLD
      - VCHR
      - AROI
      - TSUT
      - PUOR
    ExternalCashAccountTypeCode:
      type: string
      minLength: 1
      maxLength: 4
      description: |
        Specifies the nature, or use, of the cash account in the format of character string with a maximum length of 4 characters. The list of valid codes is an external code list published separately. External code sets can be downloaded from www.iso20022.org.
    ExternalClearingSystemIdentificationCode:
      type: string
      minLength: 1
      maxLength: 5
      description: |
        Specifies the clearing system identification code, as published in an external clearing system identification code list. External code sets can be downloaded from www.iso20022.org.
    ExternalCreditLineTypeCode:
      type: string
      minLength: 1
      maxLength: 4
      description: |
        Specifies the external credit line type code in the format of character string with a maximum length of 4 characters. The list of valid codes is an external code set published separately. External code sets can be downloaded from www.iso20022.org.
    ExternalEntryStatusCode:
      type: string
      minLength: 1
      maxLength: 4
      description: |
        Specifies the status of an entry on the books of the account servicer, as published in an external code set. External code sets can be downloaded from www.iso20022.org.
    ExternalOrganisationIdentificationCode:
      type: string
      minLength: 1
      maxLength: 4
      description: |
        Specifies the external organisation identification scheme name code in the format of character string with a maximum length of 4 characters. The list of valid codes is an external code list published separately. External code sets can be downloaded from www.iso20022.org.
    ExternalPersonIdentificationCode:
      type: string
      minLength: 1
      maxLength: 4
      description: |
        Specifies the external person identification scheme name code in the format of character string with a maximum length of 4 characters. The list of valid codes is an external code list published separately. External code sets can be downloaded from www.iso20022.org.
    ExternalPurposeCode:
      type: string
      minLength: 1
      maxLength: 4
      description: |
        Specifies the external purpose code in the format of character string with a maximum length of 4 characters. The list of valid codes is an external code list published separately. External code sets can be downloaded from www.iso20022.org.
    ExternalReturnReasonCode:
      type: string
      minLength: 1
      maxLength: 4
      description: "Specifies the return reason, as published in an external return reason code list. External code sets can be downloaded from www.iso20022.org."
    FinancialInstitutionIdentification:
      type: object
      description: Specifies the details to identify a financial institution.
      additionalProperties: false
      properties:
        bicfi:
          #  Code allocated to a financial institution by the ISO 9362 Registration Authority as described in ISO 9362 "Banking - Banking telecommunication messages - Business identifier code (BIC)".
          $ref: '#/components/schemas/BICFIDec2014Identifier'
        clearing_system_member_identification:
          #  Information used to identify a member within a clearing system.
          $ref: '#/components/schemas/ClearingSystemMemberIdentification'
        lei:
          #  Legal entity identifier of the financial institution.
          $ref: '#/components/schemas/LEIIdentifier'
        name:
          description:  Name by which an agent is known and which is usually used to identify that agent.
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ !#$%&\*=^_`\{\|\}~";<>@\[\\\]]+$
        postal_address:
          description: |
            Information that locates and identifies a specific address, as defined by postal services.

            RECOMMENDATION IN ORDER OF PREFERENCE: 
            * Use only structured address with mandatory Town Name and Country 
            * When using unstructured address, (Address Line), max 1 occurrence with 105 text is allowed. 
            * Address Line must not contain Country which must be included in the dedicated Country element in the unstructured structured address. 
          oneOf:
            - $ref: '#/components/schemas/PostalAddress'
            - $ref: '#/components/schemas/PostalAddressUnstructured'
        other:
          #  Unique identification of an agent, as assigned by an institution, using an identification scheme.
          $ref: '#/components/schemas/GenericIdentification'
    FromToAmountRange:
      type: object
      description: Range of amount values.
      additionalProperties: false
      properties:
        from_amount:
          #  Lower boundary of a range of amount values.
          $ref: '#/components/schemas/AmountRangeBoundary'
        to_amount:
          #  Upper boundary of a range of amount values.
          $ref: '#/components/schemas/AmountRangeBoundary'
      required:
      - from_amount
      - to_amount
    GenericIdentification:
      type: object
      description: Information related to an identification, for example, party identification or account identification.
      additionalProperties: false
      properties:
        identification:
          description:  Proprietary information, often a code, issued by the data source scheme issuer.
          type: string
          minLength: 1
          maxLength: 36
        scheme_name:
          description:  Short textual description of the scheme.
          type: string
          minLength: 1
          maxLength: 35
        issuer:
          description:  Entity that assigns the identification.
          type: string
          minLength: 1
          maxLength: 35
      required:
      - identification
    GenericOrganisationIdentification:
      type: object
      description: Information related to an identification of an organisation.
      additionalProperties: false
      properties:
        identification:
          description:  Identification assigned by an institution.
          type: string
          minLength: 1
          maxLength: 35
        scheme_name:
          #  Name of the identification scheme.
          $ref: '#/components/schemas/OrganisationIdentificationSchemeNameChoice'
        issuer:
          description:  Entity that assigns the identification.
          type: string
          minLength: 1
          maxLength: 35
      required:
      - identification
    GenericPersonIdentification:
      type: object
      description: Information related to an identification of a person.
      additionalProperties: false
      properties:
        identification:
          description:  Unique and unambiguous identification of a person.
          type: string
          minLength: 1
          maxLength: 35
        scheme_name:
          #  Name of the identification scheme.
          $ref: '#/components/schemas/PersonIdentificationSchemeNameChoice'
        issuer:
          description:  Entity that assigns the identification.
          type: string
          minLength: 1
          maxLength: 35
      required:
      - identification
    IBAN2007Identifier:
      type: string
      description: 'An identifier used internationally by financial institutions to uniquely identify the account of a customer at a financial institution, as described in the latest edition of the international standard ISO 13616: 2007 - "Banking and related financial services - International Bank Account Number (IBAN)".'
      pattern: ^[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}$
    ISODate:
      type: string
      description: 'A particular point in the progression of time in a calendar year expressed in the YYYY-MM-DD format. This representation is defined in "XML Schema Part 2: Datatypes Second Edition - W3C Recommendation 28 October 2004" which is aligned with ISO 8601.'
      pattern: ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)$
    ISODateTime:
      type: string
      description: |
        A particular point in the progression of time defined by a mandatory date and a mandatory time component, expressed in either UTC time format (YYYY-MM-DDThh:mm:ss.sssZ), local time with UTC offset format (YYYY-MM-DDThh:mm:ss.sss+/-hh:mm), or local time format (YYYY-MM-DDThh:mm:ss.sss). These representations are defined in "XML Schema Part 2: Datatypes Second Edition - W3C Recommendation 28 October 2004" which is aligned with ISO 8601.
        Note on the time format:
        1) beginning / end of calendar day
        00:00:00 = the beginning of a calendar day
        24:00:00 = the end of a calendar day
        2) fractions of second in time format
        Decimal fractions of seconds may be included. In this case, the involved parties shall agree on the maximum number of digits that are allowed.
      pattern: ^(?:[1-9]\d{3}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1\d|2[0-8])|(?:0[13-9]|1[0-2])-(?:29|30)|(?:0[13578]|1[02])-31)|(?:[1-9]\d(?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00)-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.[0-9]+)?(?:Z|[+-][01]\d:[0-5]\d)?$
    ISOTime:
      type: string
      description: |
        A particular point in the progression of time in a calendar day expressed in local time format (hh:mm:ss.sss).
        Note on the time format:
        1) beginning / end of calendar day
        00:00:00 = the beginning of a calendar day
        24:00:00 = the end of a calendar day
        2) fractions of second in time format
        Decimal fractions of seconds may be included. In this case, the involved parties shall agree on the maximum number of digits that are allowed.
      pattern: ^(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d((?:\.[0-9]+)?)?(?:Z|[+-][01]\d:[0-5]\d)?$
    ImpliedCurrencyAmountRangeChoice:
      type: object
      description: Choice between ranges of values in which an amount is considered valid or a specified amount value which has to be matched or unmatched to be valid.
      additionalProperties: true
      oneOf:
        - type: object
          required:
            - from_amount
          properties:
            from_amount:
              #  Lower boundary of a range of amount values.
              $ref: '#/components/schemas/AmountRangeBoundary'
        - type: object
          required:
            - to_amount
          properties:
            to_amount:
              #  Upper boundary of a range of amount values.
              $ref: '#/components/schemas/AmountRangeBoundary'
        - type: object
          required:
            - from_to_amount
          properties:
            from_to_amount:
              #  Range of valid amount values.
              $ref: '#/components/schemas/FromToAmountRange'
        - type: object
          required:
            - equal_amount
          properties:
            equal_amount:
              #  Exact value an amount must match to be considered valid.
              $ref: '#/components/schemas/ImpliedCurrencyAndAmount'
        - type: object
          required:
            - not_equal_amount
          properties:
            not_equal_amount:
              #  Value that an amount must not match to be considered valid.
              $ref: '#/components/schemas/ImpliedCurrencyAndAmount'
    ImpliedCurrencyAndAmount:
      type: string
      description: |
        Number of monetary units specified in a currency where the unit of currency is implied by the context and compliant with ISO 4217. The decimal separator is a dot.
        Note: a zero amount is considered a positive amount.
      maxLength: 18
      pattern: ^0*(([0-9]{0,13}\.[0-9]{1,5})|([0-9]{0,14}\.[0-9]{1,4})|([0-9]{0,15}\.[0-9]{1,3})|([0-9]{0,16}\.[0-9]{1,2})|([0-9]{0,17}\.[0-9]{1,1})|0*|([0-9]{0,18}))$
    InterestTypeChoice:
      type: object
      description: Interest type is expressed as a code or a text.
      additionalProperties: true
      oneOf:
        - type: object
          required:
            - code
          properties:
            code:
              #  Specifies the type of interest.
              $ref: '#/components/schemas/InterestTypeCode'
        - type: object
          required:
            - proprietary
          properties:
            proprietary:
              description:  Specifies the type of interest in uncoded form.
              type: string
              minLength: 1
              maxLength: 35
    InterestTypeCode:
      type: string
      description: |
        Indicates if the deal price is excluding or including the accrued interest.
        *`INDY_intra_day`
        *`OVRN_over_night`
      enum:
      - INDY
      - OVRN
    LEIIdentifier:
      type: string
      description: Legal Entity Identifier is a code allocated to a party as described in ISO 17442 "Financial Services - Legal Entity Identifier (LEI)".
      pattern: ^[A-Z0-9]{18,18}[0-9]{2,2}$
    OrganisationIdentification:
      type: object
      description: Unique and unambiguous way to identify an organisation.
      additionalProperties: false
      properties:
        any_bic:
          #  Business identification code of the organisation.
          $ref: '#/components/schemas/AnyBICDec2014Identifier'
        lei:
          #  Legal entity identification as an alternate identification for a party.
          $ref: '#/components/schemas/LEIIdentifier'
        other:
          type: array
          maxItems: 2
          description:  Unique identification of an organisation, as assigned by an institution, using an identification scheme.
          items:
            $ref: '#/components/schemas/GenericOrganisationIdentification'
    OrganisationIdentificationSchemeNameChoice:
      type: object
      description: Sets of elements to identify a name of the organisation identification scheme.
      additionalProperties: true
      oneOf:
        - type: object
          required:
            - code
          properties:
            code:
              #  Name of the identification scheme, in a coded form as published in an external list.
              $ref: '#/components/schemas/ExternalOrganisationIdentificationCode'
          additionalProperties: false
        - type: object
          required:
            - proprietary
          properties:
            proprietary:
              description:  Name of the identification scheme, in a free text form.
              type: string
              minLength: 1
              maxLength: 35
              #$ref: '#/components/schemas/Max35Text'
          additionalProperties: false
    PartyChoice:
      type: object
      description: Identification of a person, an organisation or a financial institution.
      additionalProperties: true
      oneOf:
        - type: object
          required:
            - party
          properties:
            party:
              #  Identification of a person or an organisation.
