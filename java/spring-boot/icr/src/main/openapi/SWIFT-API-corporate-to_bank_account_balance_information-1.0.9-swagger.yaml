        - type: object
          required:
            - agent
          properties:
            agent:
              #  Identification of a financial institution.
              $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification'
    PartyIdentification:
      type: object
      description: Specifies the identification of a person or an organisation.
      additionalProperties: false
      properties:
        name:
          description: Name by which a party is known and which is usually used to identify that party.
          type: string
          minLength: 1
          maxLength: 140
        postal_address:
          description: |
            Information that locates and identifies a specific address, as defined by postal services.  
            
            RECOMMENDATION IN ORDER OF PREFERENCE:   
            * Use only structured address with mandatory Town Name and Country
            * When using unstructured address, (Address Line), max 1 occurrence with 105 text is allowed.
            * Address Line must not contain Country which must be included in the dedicated Country element in the unstructured structured address.'
          oneOf:
            - $ref: '#/components/schemas/PostalAddress'
            - $ref: '#/components/schemas/PostalAddressUnstructured'
        identification:
          #  Unique and unambiguous identification of a party.
          $ref: '#/components/schemas/PartyIdentificationChoice'
        country_of_residence:
          #  Country in which a person resides (the place of a person's home). In the case of a company, it is the country from which the affairs of that company are directed.
          $ref: '#/components/schemas/CountryCode'
    PartyIdentificationChoice:
      type: object
      description: Identify the type of party identification as either organisation identification or individual identification.
      additionalProperties: true
      oneOf:
        - type: object
          required:
            - organisation_identification
          properties:
            organisation_identification:
              #  Unique and unambiguous way to identify an organisation.
              $ref: '#/components/schemas/OrganisationIdentification'
          additionalProperties: false
        - type: object
          required:
            - private_identification
          properties:
            private_identification:
              #  Unique and unambiguous identification of a person, for example a passport.
              $ref: '#/components/schemas/PersonIdentification'
          additionalProperties: false
    PaymentReturnReason:
      type: object
      description: Provides further details on the reason of the return of the transaction.
      additionalProperties: false
      properties:
        original_transaction_identification:
          description: Specify the original statement entry reference (transaction_identification) as specified in the previous statement.
          type: string
          minLength: 1
          maxLength: 35
        reason:
          #  Specifies the reason for the return.
          $ref: '#/components/schemas/ReturnReasonChoice'
        additional_information:
          description: Further details on the return reason.
          type: string
          minLength: 1
          maxLength: 105
    PercentageRate:
      type: string
      description: Rate expressed as a percentage, that is, in hundredths, for example, 0.7 is 7/10 of a percent, and 7.0 is 7%.
      maxLength: 12
    PersonIdentification:
      type: object
      description: Unique and unambiguous way to identify a person.
      additionalProperties: false
      properties:
        date_and_place_of_birth:
          #  Date and place of birth of a person.
          $ref: '#/components/schemas/DateAndPlaceOfBirth'
        other:
          type: array
          maxItems: 2
          description:  Unique identification of a person, as assigned by an institution, using an identification scheme.
          items:
            $ref: '#/components/schemas/GenericPersonIdentification'
    PersonIdentificationSchemeNameChoice:
      type: object
      description: Sets of elements to identify a name of the identification scheme.
      additionalProperties: true
      oneOf:
        - type: object
          required:
            - code
          properties:
            code:
              #  Name of the identification scheme, in a coded form as published in an external list.
              $ref: '#/components/schemas/ExternalPersonIdentificationCode'
          additionalProperties: false
        - type: object
          required:
            - proprietary
          properties:
            proprietary:
              #  Name of the identification scheme, in a free text form.
              $ref: '#/components/schemas/Max35Text'
          additionalProperties: false
    PostalAddress:
      type: object
      description: Information that locates and identifies a specific address.
      additionalProperties: false
      required:
        - town_name
        - country
      properties:
        department:
          description: Identification of a division of a large organisation or building.
          type: string
          minLength: 1
          maxLength: 70
        sub_department:
          description: Identification of a sub-division of a large organisation or building.
          type: string
          minLength: 1
          maxLength: 70
        street_name:
          description: Name of a street or thoroughfare.
          type: string
          minLength: 1
          maxLength: 70
        building_number:
          description: Number that identifies the position of a building on a street.
          type: string
          minLength: 1
          maxLength: 16
        building_name:
          description: Name of the building or house.
          type: string
          minLength: 1
          maxLength: 35
        floor:
          description: Floor or storey within a building.
          type: string
          minLength: 1
          maxLength: 70
        post_box:
          description: Numbered box in a post office, assigned to a person or organisation, where letters are kept until called for.
          type: string
          minLength: 1
          maxLength: 16
        room:
          description: Building room number.
          type: string
          minLength: 1
          maxLength: 70
        post_code:
          description: Identifier consisting of a group of letters and/or numbers that is added to a postal address to assist the sorting of mail.
          type: string
          minLength: 1
          maxLength: 16
        town_name:
          description: Name of a built-up area, with defined boundaries, and a local government.
          type: string
          minLength: 1
          maxLength: 35
        town_location_name:
          description: Specific location name within the town.
          type: string
          minLength: 1
          maxLength: 35
        district_name:
          description: Identifies a subdivision within a country sub-division.
          type: string
          minLength: 1
          maxLength: 35
        country_sub_division:
          description: Identifies a subdivision of a country such as state, region, county.
          type: string
          minLength: 1
          maxLength: 35
        country:
          description: Nation with its own government.
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2,2}$
    PostalAddressUnstructured:
      type: object
      description: Information that locates and identifies a specific address.
      additionalProperties: false
      required:
        - address_line
      properties:
        address_line:
          description: Information that locates and identifies a specific address, as defined by postal services, presented in free format text.
          type: string
          minLength: 1
          maxLength: 105
        country:
          description: Specify the country code.
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2,2}$
    Rate:
      type: object
      description: Set of elements used to qualify the interest rate.
      additionalProperties: false
      properties:
        type:
          #  Specifies the type of interest rate.
          $ref: '#/components/schemas/RateTypeChoice'
        validity_range:
          #  An amount range where the interest rate is applicable.
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmountRange'
      required:
      - type
    RateTypeChoice:
      type: object
      description: Specifies the rate as a percentage or a text.
      additionalProperties: true
      oneOf:
        - type: object
          required:
            - percentage
          properties:
            percentage:
              #  Ratio of the amount of interest paid during a certain period of time compared to the principal amount of the interest bearing financial instrument.
              $ref: '#/components/schemas/PercentageRate'
        - type: object
          required:
            - other
          properties:
            other:
              description:  Rate type expressed, in another form.
              type: string
              minLength: 1
              maxLength: 35
    ReferredDocumentTypeChoice:
      type: object
      description: Specifies the type of the document referred in the remittance information.
      additionalProperties: false
      properties:
        code:
          #  Document type in a coded form.
          $ref: '#/components/schemas/DocumentTypeCode'
        proprietary:
          description:  Proprietary identification of the type of the remittance document.
          type: string
          minLength: 1
          maxLength: 35
    RemittanceInformation:
      type: object
      description: Information supplied to enable the matching of an entry with the items that the transfer is intended to settle, such as commercial invoices in an accounts' receivable system.
      additionalProperties: false
      properties:
        referred_document_information:
          type: array
          description:  Provides the identification and the content of the referred document. For example if they payment is against outstanding invoice, provide the invoice details or to apply a credit note specify the detail.
          items:
            $ref: '#/components/schemas/Document'
        amount:
          #  Provides details on the amounts of the referred document. The amount specified is the exact amount due and payable to the creditor. 
          $ref: '#/components/schemas/CurrencyAmount'
        creditor_reference_code:
          description: Reference information provided by the creditor to allow the identification of the underlying documents.
          type: string
          enum:
            - DISP #_dispatch_advice    
            - FXDR #_foreign_exchange_deal_reference    
            - PUOR #_purchase_order    
            - RPIN #_related_payment_instruction    
            - RADM #_remittance_advice_message    
            - SCOR #_structured_communication_reference
        creditor_reference:
          description: |
            Unique reference, as assigned by the creditor, to unambiguously refer to the payment transaction.

            Usage: If available, the initiating party should provide this reference in the structured remittance information, to enable reconciliation by the creditor upon receipt of the amount of money.
            
            If the business context requires the use of a creditor reference or a payment remit identification, and only one identifier can be passed through the end-to-end chain, the creditor's reference or payment remittance identification should be quoted in the end-to-end transaction identification.
          type: string
          minLength: 1
          maxLength: 35
    RemittanceInformationChoice:
      type: object
      description: Specifies the choice of remittance information provided.
      additionalProperties: true
      oneOf:
        - type: object
          required:
            - structured
          properties:
            structured:
              type: array
              #  Information supplied to enable the matching of an entry with the items that the transfer is intended to settle, such as commercial invoices in an accounts' receivable system.  Usage - Structured Remittance can be repeated, however the total business data for all occurrences must not exceed 9,000 characters which excludes the tag names, and is irrespective of bytes per character to maintain interoperability..
              items:
                $ref: '#/components/schemas/RemittanceInformation'
          additionalProperties: false
        - type: object
          required:
            - unstructured
          properties:
            unstructured:
              description:  Information supplied to enable the matching/reconciliation of an entry with the items that the payment is intended to settle, such as commercial invoices in an accounts' receivable system, in an unstructured form.
              type: string
              minLength: 1
              maxLength: 140
          additionalProperties: false
    ReturnReasonChoice:
      type: object
      description: Specifies the reason for the return of the transaction.
      additionalProperties: true
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          code:
            #  Reason for the return, as published in an external reason code list.
            $ref: '#/components/schemas/ExternalReturnReasonCode'
        required:
        - code
      - type: object
        additionalProperties: false
        properties:
          proprietary:
            description:  Reason for the return, in a proprietary form.
            type: string
            minLength: 1
            maxLength: 35
        required:
        - proprietary
    Statement:
      type: object
      description: |
        Provides underlying details of transactions that have been included in the entry. Corporate can receive information from their bank(s) about the activity happening on a given account for cash management balance reporting. This will include all entries booked to the account for the specified period.
      additionalProperties: false
      properties:
        identification:
          description: |
            Unique identification, as assigned by the account servicer, to unambiguously identify the account statement.
          type: string
          minLength: 1
          maxLength: 36
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        creation_date_time:
          #  Date and time at which the statement was created. Recommendation that this be expressed in local time with UTC offset format (YYYY-MM-DDThh:mm:ss.sss+/-hh:mm).
          $ref: '#/components/schemas/ISODateTime'
        from_date_time:
          #  Period start date and time at which the account statement is issued. Recommendation that this be expressed in local time with UTC offset format (YYYY-MM-DDThh:mm:ss.sss+/-hh:mm).
          $ref: '#/components/schemas/ISODateTime'
        to_date_time:
          #  Period end date and time at which the account statement is issued. Recommendation that this be expressed in local time with UTC offset format (YYYY-MM-DDThh:mm:ss.sss+/-hh:mm).
          $ref: '#/components/schemas/ISODateTime'
        statement_period:
          description: |
            Specify various end of cycle statement reporting (statement periods)
            
            Usage - This may be used to indicate cycle type. Where this is used, all transactions must be related to that cycle. 
            EODY - for End of Day - Daily Statement
            EOWK - for End of Week - Weekly Statement
            EOMH - for End of Month - Monthly Statement
            EOYR - for End of Year - Yearly Statement
          type: string
          enum: [EODY, EOWK, EOMH, EOYR]
          default: EODY
        account:
          #  Unambiguous identification of the account to which credit and debit entries are made.
          $ref: '#/components/schemas/CashAccount'
        related_account:
          #  Identifies the parent account of the account for which the statement has been issued.
          $ref: '#/components/schemas/Account'
        interest:
          type: array
          description:  Provides general interest information that applies to the account at a particular moment in time.
          items:
            $ref: '#/components/schemas/AccountInterest'
        balance:
          type: array
          minItems: 2
          description: |
            Set of elements used to define the balance as a numerical representation of the net increases and decreases in an account at a specific point in time.  
            Usage - Required balance types - OPBD = OpeningBooked with date on which the opening balance was determined CLBD = ClosingBooked. Rest of the balance types must be bilaterally determined.
          items:
            $ref: '#/components/schemas/Balance'
        statement_entry:
          type: array
          description: |
            Specifies an entry in the Statement. For reporting single transaction or batch.
            
            Usage - At least one reference must be provided to identify the entry and its underlying transaction(s). 
          items:
            $ref: '#/components/schemas/StatementEntry'
        links:
          #  Contains link relations.
          $ref: '#/components/schemas/Links'
      required:
      - identification
      # - from_date_time
      - statement_period
      - account
      - balance
    StatementEntry:
      type: object
      description: |
        Specifies an entry in the Statement.
        
        Usage - At least one reference must be provided to identify the entry and its underlying transaction(s).
      additionalProperties: false
      properties:
        entry_reference:
          description: |
            Unique reference for the entry. The entry is unique per transaction within the statement. Technical incremental identification of the transaction.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        account_servicer_reference:
          description: |
            Unique reference as assigned by the account servicing institution to unambiguously identify the entry.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        amount:
          #  'The amount of money in the the original transaction. Amount in the currency of the account reported. Note that this amount can be Zero. Recommendation: treat as credit for Zero amount.'
          $ref: '#/components/schemas/CurrencyAmount'
        credit_debit_indicator:
          #  Indicates whether the entry is a credit or a debit entry.
          $ref: '#/components/schemas/CreditDebitCode'
        reversal_indicator:
          description: |
            Indicates whether or not the entry is the result of a reversal.
            
            *`Usage:` This element should only be present if the entry is the result of a reversal. If the CreditDebitIndicator is CRDT and ReversalIndicator is Yes, the original operation was a debit entry. If the CreditDebitIndicator is DBIT and ReversalIndicator is Yes, the original operation was a credit entry.
          type: boolean
          default: false
        status:
          #  'Status of an entry on the books of the account servicer. Booked for End of Cycle statement: BOOK = Booked is required.'
          $ref: '#/components/schemas/ExternalEntryStatusCode'
        booking_date:
          description: |
            Date and time when an entry is posted to an account on the account servicer''s books.  
            *`Usage:`Booking date is the expected booking date, unless the status is booked, in which case it is the actual booking date.
          oneOf:
            # $ref: '#/components/schemas/ISONormalisedDateTime'
            - $ref: '#/components/schemas/ISODateTime'
            - $ref: '#/components/schemas/ISODate'
        value_date:
          description: |
            Date and time at which assets become available to the account owner in case of a credit entry, or cease to be available to the account owner in case of a debit entry.  
            *`Usage:` If entry status is pending and value date is present, then the value date refers to an expected/requested value date. For entries subject to availability/float and for which availability information is provided, the value date must not be used. In this case the availability component identifies the number of availability days.
          oneOf:
            # $ref: '#/components/schemas/ISONormalisedDateTime'
            - $ref: '#/components/schemas/ISODateTime'
            - $ref: '#/components/schemas/ISODate'
        availability:
          type: array
          description: |
            Set of elements used to indicate when the booked amount of money will become available, that is can be accessed and starts generating interest.     
            
            Usage: This type of information is used in the US and is linked to particular instruments such as cheques. Example: When a cheque is deposited, it will be booked on the deposit day, but the amount of money will only be accessible as of the indicated availability day (according to national banking regulations).
          items:
            $ref: '#/components/schemas/CashAvailability'
        bank_transaction_code:
          #  Set of elements used to fully identify the type of underlying transaction resulting in an entry. Domain and/or proprietary may be provided. At least one must be provided, if used. The element domain_code is the prefered option and should be used when possible.
          $ref: '#/components/schemas/BankTransactionCode'
        amount_details:
          #  'Provides information on the original amount.  Usage: This component (on entry level) should be used when a total original batch or aggregate amount has to be provided. If required, the individual original amounts can be included in the same component on transaction details level.'
          $ref: '#/components/schemas/AmountAndCurrencyExchange'
        charges:
          #  Provides information on the charges, pre-advised or included in the entry amount. Usage: This must be used for batch booking where the charges cannot be split at transaction level. In all other scenario, the charges MUST be reported at entry_details level.
          $ref: '#/components/schemas/Charges'
        entry_details:
          #  Provides details on the entry.
          $ref: '#/components/schemas/StatementEntryDetails'
      required:
      - entry_reference
      - amount
      - credit_debit_indicator
      - status
      - value_date
      - bank_transaction_code
    StatementEntryDetails:
      type: object
      description: Provides details on the entry.
      additionalProperties: false
      properties:
        batch:
          #  Provides details on batched transactions.
          $ref: '#/components/schemas/BatchInformation'
        transaction_details:
          type: array
          description:  |
            Provides information on the underlying transaction(s). This provides a breakdown of the transaction details when the entry is 'batched'. If the entry is not batched and transaction details are to be reported, then transaction details must only occur once.
          items:
            $ref: '#/components/schemas/StatementTransactionDetails'
      required:
      - transaction_details
    StatementLine:
      type: object
      description: Posting to an account that results in an increase or decrease to a balance.
      additionalProperties: false
      properties:
        entry_reference:
          description: Unique reference for the entry. Technical incremental identification of the transaction.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        references:
          #  Provides the identification of the underlying transaction.
          $ref: '#/components/schemas/TransactionReferences'
        batch:
          #  Provides details on batched transactions.
          $ref: '#/components/schemas/BatchInformation'
        amount:
          #  The amount of money in the original transaction.
          $ref: '#/components/schemas/CurrencyAmount'
        credit_debit_indicator:
          #  Indicates whether the entry is a credit or a debit entry.
          $ref: '#/components/schemas/CreditDebitCode'
        booking_date:
          description: |
            Date and time when an entry is posted to an account on the account servicer's books. 
            *`Usage:`Booking date is the expected booking date, unless the status is booked, in which case it is the actual booking date.
          oneOf:
            - $ref: '#/components/schemas/ISODateTime'
            - $ref: '#/components/schemas/ISODate'
        value_date:
          description: |
            Date and time at which assets become available to the account owner in case of a credit entry, or cease to be available to the account owner in case of a debit entry. 
            *`Usage:` If entry status is pending and value date is present, then the value date refers to an expected/requested value date. For entries subject to availability/float and for which availability information is provided, the value date must not be used. In this case the availability component identifies the number of availability days.
          oneOf:
            - $ref: '#/components/schemas/ISODateTime'
            - $ref: '#/components/schemas/ISODate'
        bank_transaction_code:
          #  Set of elements used to fully identify the type of underlying transaction resulting in an entry. Domain and/or proprietary may be provided. At least one must be provided, if used. The element domain_code is the preferred option and should be used when possible.
          $ref: '#/components/schemas/BankTransactionCode'
        purpose:
          #  'Underlying reason for the payment transaction.  Usage: Purpose is used by the end-customers, that is initiating party, (ultimate) debtor, (ultimate) creditor to provide information concerning the nature of the payment. Purpose is a content element, which is not used for processing by any of the agents involved in the payment chain.'
          $ref: '#/components/schemas/ExternalPurposeCode'
        remittance_information:
          #  Structured information that enables the matching, that is reconciliation, of a payment with the items that the payment is intended to settle, such as commercial invoices in an account receivable system.
          $ref: '#/components/schemas/RemittanceInformationChoice'
      required:
      - entry_reference
      - amount
      - credit_debit_indicator
      - bank_transaction_code
    StatementLineSummary:
      type: object
      description: |
        Provides underlying details of transactions that have been included in the entry. Corporate can receive information from their bank(s) about the activity happening on a given account for cash management balance reporting. This will include all entries booked to the account for the specified period.
      additionalProperties: false
      properties:
        identification:
          description: Unique identification, as assigned by the account servicer, to unambiguously identify the account statement.
          type: string
          minLength: 1
          maxLength: 36
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        # batch:
        #   #  Provides details on batched transactions.
        #   $ref: '#/components/schemas/BatchInformation'
        creation_date_time:
          #  Date and time at which the report was created. Recommendation that this be expressed in local time with UTC offset format (YYYY-MM-DDThh:mm:ss.sss+/-hh:mm).
          $ref: '#/components/schemas/ISODateTime'
        from_date_time:
          #  Period start date and time at which the report is issued. Recommendation that this be expressed in local time with UTC offset format (YYYY-MM-DDThh:mm:ss.sss+/-hh:mm).
          $ref: '#/components/schemas/ISODateTime'
        to_date_time:
          #  Period end date and time at which the report is issued. Recommendation that this be expressed in local time with UTC offset format (YYYY-MM-DDThh:mm:ss.sss+/-hh:mm).
          $ref: '#/components/schemas/ISODateTime'
        account:
          #  Unambiguous identification of the account to which credit and debit entries are made.
          $ref: '#/components/schemas/CashAccount'
        statement_line:
          type: array
          description:  Specifies one or more debit/credit entry.
          items:
            $ref: '#/components/schemas/StatementLine'
        links:
          $ref: '#/components/schemas/Links'
      required:
      - identification
      # - from_date_time
      - account
    StatementTransactionDetails:
      type: object
      description: Provides information on the underlying transaction(s). This provides a breakdown of the transaction details when the entry is 'batched'. If the entry is not batched and transaction details are to be reported, then transaction details must only occur once.
      additionalProperties: false
      properties:
        references:
          #  Provides the identification of the underlying transaction.
          $ref: '#/components/schemas/TransactionReferences'
        amount:
          #  'Amount of money in the cash transaction.  The number of fractional digits (or minor unit of currency) must comply with ISO 4217. Note: The decimal separator is a dot.'
          $ref: '#/components/schemas/CurrencyAmount'
        credit_debit_indicator:
          #  Indicates whether the transaction is a credit or a debit transaction.
          $ref: '#/components/schemas/CreditDebitCode'
        amount_details:
          #  'Provides detailed information on the original amount. All Amount Details are in most cases given on the transaction_details level (not on statement_line level) on single and batch bookings. When batch booked statement_line has underlying transactions with charges, statement_line level amount_details is used for totalling the underlying transaction amounts and charges details added with batch specific items. For consistency purposes statement_line/amount information is repeated at transaction_details/amount_details/transaction_amount.   Usage: This component (on transaction level) should be used in case booking is for a single transaction and the original amount is different from the entry amount. It can also be used in case individual original amounts are provided in case of a batch or aggregate booking.'
          $ref: '#/components/schemas/AmountAndCurrencyExchange'
        availability:
          description: |
            Set of elements used to indicate when the booked amount of money will become available, that is can be accessed and starts generating interest.   
            
            Usage - This type of information is used in the US and is linked to particular instruments such as cheques. Example - When a cheque is deposited, it will be booked on the deposit day, but the amount of money will only be accessible as of the indicated availability day (according to national banking regulations).
          type: array
          items:
            $ref: '#/components/schemas/CashAvailability'
        bank_transaction_code:
          #  Provides information on the original amount.  Usage: This component (on entry level) should be used when a total original batch or aggregate amount has to be provided. If required, the individual original amounts can be included in the same component on transaction details level.
          $ref: '#/components/schemas/BankTransactionCode'
        charges:
          #  Provides information on the charges, pre-advised or included in the entry amount. Usage: This must be used in case the booking is for a single transaction or for a batch transaction where each charge amounts are applied to individual transactions.
          $ref: '#/components/schemas/Charges'
        related_parties:
          #  Identify the parties related to the underlying transaction.
          $ref: '#/components/schemas/TransactionParties'
        related_agents:
          #  Set of elements used to identify the agents related to the underlying transaction.
          $ref: '#/components/schemas/TransactionAgents'
        purpose:
          #  'Underlying reason for the payment transaction.  Usage: Purpose is used by the end-customers, that is initiating party, (ultimate) debtor, (ultimate) creditor to provide information concerning the nature of the payment. Purpose is a content element, which is not used for processing by any of the agents involved in the payment chain.'
          $ref: '#/components/schemas/ExternalPurposeCode'
        remittance_information:
          #  Structured information that enables the matching, that is reconciliation, of a payment with the items that the payment is intended to settle, such as commercial invoices in an account receivable system.
          $ref: '#/components/schemas/RemittanceInformationChoice'
        related_dates:
          #  Set of elements used to identify the dates related to the underlying transactions.
          $ref: '#/components/schemas/TransactionDates'
        return_information:
          #  Provides the payment return information.
          $ref: '#/components/schemas/PaymentReturnReason'
      required:
      - references
      - credit_debit_indicator
    TaxCharges:
      type: object
      description: Amount of money due to the government or tax authority, according to various pre-defined parameters such as thresholds or income.
      additionalProperties: false
      properties:
        identification:
          description:  Unique reference to unambiguously identify the nature of the tax levied, such as Value Added Tax (VAT).
          type: string
          minLength: 1
          maxLength: 35
        rate:
          #  Rate used to calculate the tax.
          $ref: '#/components/schemas/PercentageRate'
        amount:
          #  Amount of money resulting from the calculation of the tax.
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyAndAmount'
    TransactionAgents:
      type: object
      description: Provides further details on the agents specific to the individual transaction.
      additionalProperties: false
      properties:
        instructing_agent:
          #  Agent that instructs the next party in the chain to carry out the (set of) instruction(s).
          $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification'
        instructed_agent:
          #  Agent that is instructed by the previous party in the chain to carry out the (set of) instruction(s).
          $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification'
        debtor_agent:
          #  Financial institution servicing an account for the debtor.
          $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification'
        creditor_agent:
          #  Financial institution servicing an account for the creditor.
          $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification'
        intermediary_agent1:
          #  'Agent between the debtor's agent and the creditor's agent.  Usage: If more than one intermediary agent is present, then IntermediaryAgent1 identifies the agent between the DebtorAgent and the IntermediaryAgent2.'
          $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification'
        intermediary_agent2:
          #  'Agent between the debtor's agent and the creditor's agent.  Usage: If more than two intermediary agents are present, then IntermediaryAgent2 identifies the agent between the IntermediaryAgent1 and the IntermediaryAgent3.'
          $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification'
        intermediary_agent3:
          #  'Agent between the debtor's agent and the creditor's agent.  Usage: If IntermediaryAgent3 is present, then it identifies the agent between the IntermediaryAgent 2 and the CreditorAgent.'
          $ref: '#/components/schemas/BranchAndFinancialInstitutionIdentification'
    TransactionDates:
      type: object
      description: Set of elements used to provide information on the dates related to the underlying individual transaction.
      additionalProperties: false
      properties:
        acceptance_date_time:
          #  Point in time when the payment order from the initiating party meets the processing conditions of the account servicing agent. This means that the account servicing agent has received the payment order and has applied checks such as authorisation, availability of funds.
          $ref: '#/components/schemas/ISODateTime'
        trade_activity_contractual_settlement_date:
          #  Identifies when an amount of money should have contractually been credited or debited the account versus when the amount of money was actually settled (debited/credited) on the cash account.
          $ref: '#/components/schemas/ISODate'
        trade_date:
          #  Date on which the trade was executed.
          $ref: '#/components/schemas/ISODate'
        interbank_settlement_date:
          #  Date on which the amount of money ceases to be available to the agent that owes it and when the amount of money becomes available to the agent to which it is due.
          $ref: '#/components/schemas/ISODate'
        start_date:
          #  Start date of the underlying transaction, such as a treasury transaction, an investment plan.
          $ref: '#/components/schemas/ISODate'
        end_date:
          #  End date of the underlying transaction, such as a treasury transaction, an investment plan.
          $ref: '#/components/schemas/ISODate'
        transaction_date_time:
          #  Date and time of the underlying transaction.
          $ref: '#/components/schemas/ISODateTime'
    TransactionParties:
      type: object
      description: Provides further details on the parties specific to the individual transaction.
      additionalProperties: false
      properties:
        initiating_party:
          #  Party that initiated the payment that is reported in the entry.
          $ref: '#/components/schemas/PartyChoice'
        debtor:
          #  Party that owes an amount of money to the (ultimate) creditor.
          $ref: '#/components/schemas/PartyChoice'
        debtor_account:
          #  Unambiguous identification of the account of the debtor.
          $ref: '#/components/schemas/Account'
        ultimate_debtor:
          #  Ultimate party that owes an amount of money to the (ultimate) creditor.
          $ref: '#/components/schemas/PartyChoice'
        creditor:
          #  Party to which an amount of money is due.
          $ref: '#/components/schemas/PartyChoice'
        creditor_account:
          #  Unambiguous identification of the account of the creditor to which a credit entry has been posted as a result of the payment transaction.
          $ref: '#/components/schemas/Account'
        ultimate_creditor:
          #  Ultimate party to which an amount of money is due.
          $ref: '#/components/schemas/PartyChoice'
    TransactionReferences:
      type: object
      description: Identifies the underlying transaction.
      additionalProperties: false
      properties:
        message_identification:
          description: Point to point reference, as assigned by the instructing party of the underlying message.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        account_servicer_reference:
          description:  Unique reference, as assigned by the account servicing institution, to unambiguously identify the instruction.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        payment_information_identification:
          description:  Unique identification, as assigned by a sending party, to unambiguously identify the payment information group within the message.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        instruction_identification:
          description: |
            Unique identification, as assigned by an instructing party for an instructed party, to unambiguously identify the instruction.  Usage: The instruction identification is a point to point reference that can be used between the instructing party and the instructed party to refer to the individual instruction. It can be included in several messages related to the instruction.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        end_to_end_identification:
          description: |
            Unique identification, as assigned by the initiating party, to unambiguously identify the transaction. This identification is passed on, unchanged, throughout the entire end-to-end chain.  Usage: The end-to-end identification can be used for reconciliation or to link tasks relating to the transaction. It can be included in several messages related to the transaction.  Usage: In case there are technical limitations to pass on multiple references, the end-to-end identification must be passed on throughout the entire end-to-end chain.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        uetr:
          description:  Universally unique identifier to provide an end-to-end reference of a payment transaction.
          type: string
          format: uuid
        transaction_identification:
          description: |
            Unique identification, as assigned by the first instructing agent, to unambiguously identify the transaction that is passed on, unchanged, throughout the entire interbank chain.  Usage: The transaction identification can be used for reconciliation, tracking or to link tasks relating to the transaction on the interbank level.  Usage: The instructing agent has to make sure that the transaction identification is unique for a pre-agreed period.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        mandate_identification:
          description:  Unique identification, as assigned by the creditor, to unambiguously identify the mandate.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        cheque_number:
          description:  Unique and unambiguous identifier for a cheque as assigned by the agent.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^[0-9a-zA-Z/\-\?:\(\)\.,'\+ ]+$
        clearing_system_reference:
          description: |
            Unique reference, as assigned by a clearing system, to unambiguously identify the instruction. Usage: In case there are technical limitations to pass on multiple references, the end-to-end identification must be passed on throughout the entire end-to-end chain.
          type: string
          minLength: 1
          maxLength: 35

##################################
# Account Information Components #
##################################

    ActiveCurrencyAndAmount:
      type: object
      description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
      properties:
        currency:
          $ref: '#/components/schemas/ActiveCurrencyCode'
        amount:
          type: string
          maxLength: 19
          pattern: '^0*(([0-9]{0,13}\.[0-9]{1,5})|([0-9]{0,14}\.[0-9]{1,4})|([0-9]{0,15}\.[0-9]{1,3})|([0-9]{0,16}\.[0-9]{1,2})|([0-9]{0,17}\.[0-9]{1,1})|0*|([0-9]{0,18}))$'
    ActiveCurrencyCode:
      type: string
      pattern: ^[A-Z]{3,3}$
      description: |
        A code allocated to a currency by a Maintenance Agency under an international identification scheme as described in the latest edition of the international standard ISO 4217 'Codes for the representation of currencies and funds
    AmountAndDirection52:
      type: object
      description: Posting of an item to a cash account, in the context of a cash transaction, that results in an increase or decrease to the balance of the account.
      additionalProperties: false
      properties:
        amount:
          #  Amount of money in the cash entry.
          $ref: '#/components/schemas/ActiveCurrencyAndAmount'
        credit_debit_indicator:
          #  Indicates whether an entry is a credit or a debit.
          $ref: '#/components/schemas/CreditDebitCode'
      required:
      - amount
      - credit_debit_indicator
    BICFIDec2014Identifier:
      type: string
      description: |
        Code allocated to a financial institution by the ISO 9362 Registration Authority as described in ISO 9362 - 2014 - Banking - Banking telecommunication messages - Business identifier code (BIC)
      pattern: ^[A-Z0-9]{4,4}[A-Z]{2,2}[A-Z0-9]{2,2}([A-Z0-9]{3,3}){0,1}$
    BalancesList3:
      type: object
      description: List of the balances that can be retrieved on a given account
      additionalProperties: false
      properties:
        current_balance:
          #  Provides detailed information of the current balance of a specific cash account. It is the balance of the account calculated at the time of request before returning the response as specified in the date_time element.
          $ref: '#/components/schemas/CashCurrentBalance1'
        available_balance:
          #  Provides detailed information of the available balance of a specific cash account. This is the funds which are available to the account owner (if credit balance) or the balance which is subject to interest charges (if debit balance).
          $ref: '#/components/schemas/CashAvailableBalance1'
        forward_available_balance:
          type: array
          description: |
            Provides detailed information of the forward available balance of a specific cash account. Subject to the service provided by the Account Servicer, forward available balance can be presented with multiple times for multiple reference dates.
          items:
            $ref: '#/components/schemas/CashForwardAvailableBalance1'
      required:
      - current_balance
    CashAccount41:
      type: object
      description: Specifies the details of the cash account.
      additionalProperties: false
      required:
      - account_identification
      - name
      - currency
      - balances
      properties:
        account_identification:
          description: |
            Identification of the account as defined by the account service provider. It can be in IBAN or proprietary format.
            
            RECOMMENDATION IN ORDER OF PREFERENCE:
            IBAN - When available IBAN must be specified for instance endpoint or hyper link to work.
            Other - In the absence of IBAN, this must be an unique account identification used for routing of the payment to the account via clearing system. A format which is agreed between the account owner and the account servicer. For example a SWIFT BIC/Branch Code and Account number.
          type: string
          minLength: 1
          maxLength: 34
        # resource_identification:
        alternate_identification:
          description: |
            The ID of the account that the bank account is associated with. The value must be constant throughout the lifecycle of the account. This identification shall be used as a resource identifier where account identification cannot be used as a resource identification. Specified as Universally Unique Identifier (UUID) version 4, as described in IETC RFC 4122 "Universally Unique Identifier (UUID) URN Namespace
            
            Usage: The account_identification is the resource identification. This identification should be used when account_identification cannot be used as an identification due to the internal policy of an organisation. Should that be the case, all other endpoint require account_identification in path parameter must use the same identification return by this endpoint.
          type: string
          format: uuid
        account_servicer:
          #  'Identification of the account servicer. '
          $ref: '#/components/schemas/BICFIDec2014Identifier'
        name:
          #  'Name of the account, as assigned by the account servicing institution, in agreement with the account owner in order to provide an additional means of identification of the account.  Usage: The account name is different from the account owner name. The account name is used in certain user communities to provide a means of identifying the account, in addition to the account owner's identity and the account number.'
          $ref: '#/components/schemas/Max70Text'
        owner_name:
          #  Name of the account owner.
          $ref: '#/components/schemas/Max70Text'
        currency:
          #  Currency used for the account.
          $ref: '#/components/schemas/ActiveCurrencyCode'
        related_account:
          description: |
            Identifies the parent account of the account for which the statement has been issued.
            Usage: Should be used when more than one identification is required to clearly establish the identity. For example when Proxy Identification is specified in primary identification a secondary identification Proxy Code is required for unambiguous identification. Another example is when Virtual Account or Zero Balance Account is specified in the primary identification, the alternate identification should be the parent account.
          type: string
          minLength: 1
          maxLength: 34
        balances:
          #  List of balances available for the query.
          $ref: '#/components/schemas/BalancesList3'
        status:
          #  'Account status. The value is one of the following: - 'enabled': account is available - 'deleted': account is terminated - 'blocked': account is blocked, for example for legal reasons If this field is not used, than the account is available in the sense of this specification. Depending on Account Servicers handling, some may not return details when the account is 'blocked'.'
          $ref: '#/components/schemas/Max35Text'
        credit_limit:
          #  Defines the credit limit of the account owner aggregated for all cards related to this card account in total.
          $ref: '#/components/schemas/ActiveCurrencyAndAmount'
        links:
          # Here goes all of the links that apply to this instance
          $ref: '#/components/schemas/Links'
    CashAvailableBalance1:
      type: object
      description: |
        The amount of money that is at the disposal of the account owner on the date time specified. Available balance is calculated in the course of the account servicer business day, at the time specified, and subject to further changes during the business day. The balance is calculated on the basis of booked credit and debit items during the calculation time/period specified.
      additionalProperties: false
      properties:
        balance_amount:
          #  Amount of money of the cash balance on the availability date.
          $ref: '#/components/schemas/AmountAndDirection52'
        availability_date:
          #  Availability date for the balance. The date time must be specified in UTC offset format - YYYY-MM-DDThh:mm:ss.sss+/-hh:mm.
          #$ref: '#/components/schemas/ISODate'
          $ref: '#/components/schemas/ISODateTime'
      required:
      - balance_amount
      - availability_date
    CashCurrentBalance1:
      type: object
      description: |
        Provides detailed information of the current balance of a specific cash account. It is the balance of the account calculated at the time of request before returning the response as specified in the date_time element. If the balance include credit line, this must be indicated using the element credit_line.
      additionalProperties: false
      properties:
        balance_amount:
          #  Amount of money of the cash balance on the date_time specified.
          $ref: '#/components/schemas/AmountAndDirection52'
        last_change_date_time:
          #  Timestamp of the last change of the balance amount.
          # Date and time when the balance was last updated following an entry posted to the account, in the books of the account servicing institution. Date time must be specified in UTC offset format - YYYY-MM-DDThh:mm:ss.sss+/-hh:mm.
          $ref: '#/components/schemas/ISODateTime'
        date_time:
          #  Specify the date and time of the balance.
          # This field indicates the date, time and time zone at which the report was created. Date time must be specified in UTC offset format - YYYY-MM-DDThh:mm:ss.sss+/-hh:mm.
          $ref: '#/components/schemas/ISODateTime'
        last_committed_transaction_identification:
          #  'Identification of the last committed transaction. This is actually useful for instant balance.  Usage: this element can provide both transaction reference or the UUID of the transaction (recommended).'
          $ref: '#/components/schemas/Max40Text'
        credit_line:
          type: array
          description:  Provides details on the credit line linked to the account.
          items:
            $ref: '#/components/schemas/CreditLine6'
      required:
      - balance_amount
      - date_time
    CashForwardAvailableBalance1:
      type: object
      description: |
        Individual forward available balance details on a given cash account. It is the forward available balance of money that is at the disposal of the account owner on the date specified.
      additionalProperties: false
      properties:
        balance_amount:
          #  Amount of money of the cash balance on the reference date.
          $ref: '#/components/schemas/AmountAndDirection52'
        availability_date:
          #  The date when the booked amount of money will become available.
          $ref: '#/components/schemas/ISODate'
      required:
      - balance_amount
      - availability_date
    CreditLine6:
      type: object
      description: Specifies the details of a credit line.
      additionalProperties: false
      properties:
        included:
          description: Indicates whether or not the credit line is included in the balance.
          type: boolean
        type:
          #  Type of the credit line provided when multiple credit lines may be provided.
          $ref: '#/components/schemas/Max35Text'
        amount:
          #  Amount of money of the credit line.
          $ref: '#/components/schemas/ActiveCurrencyAndAmount'
      required:
      - included
    Max15NumericText:
      type: string
      description: Specifies a numeric string with a maximum length of 15 digits.
      pattern: ^[0-9]{1,15}$
    Max34Text:
      type: string
      description: Specifies a character string with a maximum length of 34 characters.
      minLength: 1
      maxLength: 34
    Max35Text:
      type: string
      description: Specifies a character string with a maximum length of 35 characters.
      minLength: 1
      maxLength: 35
    Max40Text:
      type: string
      description: Specifies a character string with a maximum length of 40 characters.
      minLength: 1
      maxLength: 40
    Max70Text:
      type: string
      description: Specifies a character string with a maximum length of 70characters.
      minLength: 1
      maxLength: 70
    NumberAndSumOfTransactions5:
      type: object
      description: Set of elements providing the total sum of entries.
      additionalProperties: false
      properties:
        number_of_entries:
          #  Number of individual entries included in the report.
          $ref: '#/components/schemas/Max15NumericText'
        total_net_entry:
          #  Resulting debit or credit amount of the netted amounts for all debit and credit entries.
          $ref: '#/components/schemas/AmountAndDirection52'
      required:
      - number_of_entries
      - total_net_entry
    NumberAndSumOfTransactions6:
      type: object
      description: Set of elements providing the total sum of entries.
      additionalProperties: false
      properties:
        number_of_entries:
          #  Number of individual entries included in the report.
          $ref: '#/components/schemas/Max15NumericText'
        total:
          #  Total of all individual entries included in the report.
          $ref: '#/components/schemas/ActiveCurrencyAndAmount'
      required:
      - number_of_entries
      - total
    TransactionSummary1:
      type: object
      description: Provides a summary on entries for a specific period.
      additionalProperties: false
      properties:
        account_identification:
          #  Identification of the account as defined by the account service provider.
          $ref: '#/components/schemas/Max34Text'
        from_date_time:
          #  Start date time of the range.
          $ref: '#/components/schemas/ISODateTime'
        to_date_time:
          #  End date time of the range.
          $ref: '#/components/schemas/ISODateTime'
        total_entries:
          #  Specifies the total number and sum of debit and credit entries.
          $ref: '#/components/schemas/NumberAndSumOfTransactions5'
        total_credit_entries:
          #  Specifies the total number and sum of credit entries.
          $ref: '#/components/schemas/NumberAndSumOfTransactions6'
        total_debit_entries:
          #  Specifies the total number and sum of debit entries.
          $ref: '#/components/schemas/NumberAndSumOfTransactions6'
      required:
      - account_identification
      - from_date_time
      - to_date_time

#########################
    Links:
      type: array
      items:
        $ref: '#/components/schemas/Link'
    Link:
      type: object
      readOnly: true
      description: "Contains a generic structure to support hyperlinking (REST level 3)."
      additionalProperties: false
      required:
      - href
      properties:
        href:
          description:  "Specifies the link as a url. The href member identifies the target IRI location of the resource."
          type: string
          maxLength: 256
        rel:
          description: "Specifies the operation. The value of this property MUST be a string. This property is required except self. The self reference contains the URI of the same resource."
          type: string
          maxLength: 35
        type:
          description: "The value containing the HTTP verb used for the URL. If the type element is not included then the link MUST be available using GET."
          type: string
          maxLength: 35
    Errors:
      description: "Container to return multiple ErrorMessage object. Collection of error can be useful when API needs to return multiple errors, for example validation errors. When the response code conveys application-specific functional semantics and consumer can parse machine-readable error code, this block can be useful. The error response must contain at least one error object."
      type: array
      items:
        $ref: "#/components/schemas/ErrorMessage"
    ErrorMessage:
      description: "Custom error schema to support detailed error message."
      required:
      - code
      - severity
      - text
      type: object
      properties:
        severity:
          description: "Specifies the severity of the error."
          type: string
          enum:
          - Fatal
          - Transient
          - Logic
        code:
          description: "Specifies the custom error code as defined by the service provider."
          type: string
          minLength: 3
          maxLength: 70
        text:
          description: "Specifies the detail error message identifying the cause of the error."
          type: string
          minLength: 1
          maxLength: 255
        user_message:
          description: "A human-readable text describing the error."
          type: string
          minLength: 1
          maxLength: 255
        more_info:
          description: "Specifies an URL to find more information about the error."
          type: string
          format: uri
  headers:
    Location:
      description: 'The Location response header containing the URI to the newly created resource.'
      schema:
        type: string
        format: uri
    X-Request-ID:
      description: "Specify an unique end to end tracking request ID. The element will be populated by the SWIFT API gateway"
      schema:
        type: string
  parameters:
    pagination-offset:
      name: offset
      in: query
      style: form
      explode: false
      description: "Specifies the offset / starting point in the list of all available items, starting from which results will be returned. The numeric offset identifies the page token, allowing users to advance to the next page in the collection. The value 0 (zero) identifies the first page of entry."
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    pagination-limit:
      name: limit
      in: query
      style: form
      explode: false
      description: "The maximum number of items to return in a page. If unspecified, the default limit will be returned. If the limit specified is greater than the maximum permitted by the API, the API will return the maximum permitted limit. Each API should define *maximum and *default limit."
      required: false
      schema:
        type: integer
        minimum: 1
      example: 1000
    X-Request-ID:
      description: "Specify an unique end to end tracking request ID. The element will be populated by the SWIFT API gateway"
      name: X-Request-ID
      in: header
      schema:
        type: string
    X-UserContext:
      name: X-UserContext
      in: header
      description: Provides requester entitlement information to service provider. A JWT containing a claim representing the entitlements of the API consumer as defined at the SWIFT Identity Provider. This header is provided by the SWIFT API Gateway and is not required to be provided by the API consumer.
      required: false
      schema:
        type: string
      example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIiLCJuYW1lIjoiIiwiaWF0IjowfQ.u_kftAUkjiUZO-OhIyj24H7lOUk1wi9GUF-e14JmCtQ'
    X-BIC:
      name: X-BIC
      in: header
      description: "Specify the BIC of the provider of the service. The identification will be used by the API Gateway to forward the request to service provider."
      required: true
      schema:
        type: string
      example: 'DEUTDEFF'
    identifier:
      name: account-identification
      in: path
      style: simple
      explode: false
      description: |
        An unique and unambiguous identification for the account as assigned by the account servicer. It can be in IBAN or proprietary format.

        RECOMMENDATION IN ORDER OF PREFERENCE:
        IBAN - When available IBAN must be specified for instance endpoint or hyper link to work.
        Other - In the absence of IBAN, this must be an unique account identification used for routing of the payment to the account via clearing system. A format which is agreed between the account owner and the account servicer. For example a SWIFT BIC/Branch Code and Account number.
      required: true
      schema:
        type: string
        maxLength: 36
      example: 'DE27212110090000000235698765'
    transactions-summary-from-date:
      name: from-date
      in: query
      description: |
        The start date for which summary information is requested. The result will be filtered on creation_date_time. Expressed in the YYYY-MM-DD format. The date cannot be in the future.
      required: true
      schema:
        $ref: '#/components/schemas/ISODate'
      example: '2021-09-15'
    transactions-summary-to-date:
      name: to-date
      in: query
      description: |
        The end date for which summary information is requested. The result will be filtered on creation_date_time. Expressed in the YYYY-MM-DD format. The date cannot be in the future.
      required: false
      schema:
        $ref: '#/components/schemas/ISODate'
      example: '2021-09-15'
    from-date:
      name: from-date
      in: query
      description: |
        The query parameter can use either a specific creation_from_date or date range in the form of creation_from_date and creation_to_date. The result will be filtered on creation_date_time. Expressed in the YYYY-MM-DD format. The date cannot be in the future.
      
        Usage - The parameter is mandatory and default behaviour is to provide the end of day statement for the current date. When used in conjunction with statement-period (weekly, monthly, yearly), returns the statement where the from date fall within that period.
      required: true
      schema:
        $ref: '#/components/schemas/ISODate'
      example: '2021-09-15'
    to-date:
      name: to-date
      in: query
      description: |
        The query parameter can use either a specific creation_from_date or date range in the form of creation_from_date and creation_to_date. For a specific date, creation_to_date must not be provided. The result will be filtered on creation_date_time. Expressed in the YYYY-MM-DD format. The date cannot be in the future.
        
        Usage - When used in conjunction with the statement-period (weekly, monthly, yearly) and from date,  the endpoint returns the statement where the from date to date fall within that period. The parameter must not be used for the statement period EODY. If supplied, the parameter will be ignored.
      required: false
      schema:
        $ref: '#/components/schemas/ISODate'
      example: '2021-09-15'
    from-time:
      name: creation-from-time
      in: query
      description: |
        A particular point in the progression of time in a calendar day expressed in local time format (hh:mm:ss.sss). These representations are aligned with ISO 8601.
        Note on the time format:
        * beginning / end of calendar day
        00:00:00 = the beginning of a calendar day
        24:00:00 = the end of a calendar day
        * fractions of second in time format
        Decimal fractions of seconds may be included. In this case, the involved parties shall agree on the maximum number of digits that are allowed.
        * If the parameter is omitted, all entries from the beginning of the day will be included.

        The result will be filtered on creation_date_time of the entry. 
      schema:
        $ref: '#/components/schemas/ISOTime'
      example: '00:00:00'
    to-time:
      name: creation-to-time
      in: query
      description: |
        A particular point in the progression of time in a calendar day expressed in local time format (hh:mm:ss.sss). These representations are aligned with ISO 8601.
        Note on the time format:
        * beginning / end of calendar day
        00:00:00 = the beginning of a calendar day
        24:00:00 = the end of a calendar day
        * fractions of second in time format
        Decimal fractions of seconds may be included. In this case, the involved parties shall agree on the maximum number of digits that are allowed.
        * If the parameter is omitted, all entries from the beginning of the day up to the request time will be included.
      
        The query parameter can use either a specific creation_from_time or time range in the form of creation_from_time and creation_to_time. For up to a requested time, creation_to_time must not be provided. The result will be filtered on creation_date_time.
      required: false
      schema:
        $ref: '#/components/schemas/ISOTime'
      example: '23:59:00'
    account-identification:
      name: account-identification
      in: query
      style: form
      explode: false
      description: |
        Unique and unambiguous identification for the account between the account owner and the account servicer. It can be in IBAN or proprietary format.
        
        RECOMMENDATION IN ORDER OF PREFERENCE:
        IBAN - International Bank Account Number (IBAN) - identifier used internationally by financial institutions to uniquely identify the account of a customer. Further specifications of the format and content of the IBAN can be found in the standard ISO 13616 "Banking and related financial services - International Bank Account Number (IBAN)" version 1997-10-01, or later revisions. When available IBAN must be specified for instance endpoint or hyper link to work.
        
        Other - Identifier used nationally by financial institutions, i.e., in individual countries, generally as part of a National Account Numbering Scheme(s), to uniquely identify the account of a customer. In the absence of IBAN, this must be an unique account identification used for routing of the payment to the account via clearing system. A format which is agreed between the account owner and the account servicer. For example a SWIFT BIC/Branch Code and Account number.
      required: false
      schema:
        type: array
        items:
          type: string
          maxLength: 36
      example: 'DE27212110090000000235698765,DE27212318890001010223463456'
    account-servicer:
      name: account-servicer
      in: query
      style: form
      explode: false
      description: |
        Party that manages the account on behalf of the account owner, that is manages the registration and booking of entries on the account, calculates balances on the account and provides information about the account. Valid BICs for financial institutions are registered and published by the ISO 9362 Registration Authority in the ISO directory of BICs, and consist of eight (8) or eleven (11) contiguous characters.
        
        Usage - The parameter provides the ability to a consumer requesting account related to a specific BIC.
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/BICFIDec2014Identifier'
      example: 'DEUTDEFF'
    currency:
      name: currency
      in: query
      style: form
      explode: false
      description: |
        Specifies the currency of the account. The Currency Code must be registered, or have already been registered with the ISO 4217 Maintenance Agency, consist of three (3) contiguous letters, and may be or not be withdrawn on the day the message containing the Currency is exchanged.
      required: false
      schema:
        $ref: '#/components/schemas/CurrencyCode'
      example: 'EUR'
    statement-period:
      name: statement-period
      in: query
      style: form
      explode: false
      description: |
        Specify various end of cycle statement reporting (statement periods).
        
        Usage - This may be used to indicate cycle type. Where this is used, all transactions must be related to that cycle.
      required: false
      schema:
        type: string
        enum: [EODY, EOWK, EOMH, EOYR]
      example: 'EODY'
    credit-debit-code:
      name: credit-debit-code
      in: query
      style: form
      explode: false
      description: |
        Specifies if an operation is an increase or a decrease.
        *`CRDT`-Operation is an increase.
        *`DBIT`-Operation is a decrease.
      schema:
        type: string
        enum: [CRDT, DBIT]
      example: 'CRDT'
